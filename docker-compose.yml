services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    build:
      context: ./docker
      dockerfile: auth-emulator.Dockerfile
    ports:
      - "9099:9099"
    volumes:
      - auth_data:/data
    command: ["firebase", "emulators:start", "--only", "auth", "--project", "demo-drwriter", "--import", "/data/export", "--export-on-exit", "/data/export"]
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9099/').then(() => process.exit(0)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 40

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "5000:5000"
      - "3001:3001"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      auth:
        condition: service_healthy

volumes:
  mongo_data:
  auth_data:
  uploads:
